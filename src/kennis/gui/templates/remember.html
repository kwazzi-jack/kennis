{% extends "base.html" %}
{% block title %}kennis - remember{% endblock %}
{% block main %}
<h1>Remember</h1>
<p class="role-muted">{{ preamble }}</p>
<form hx-post="/remember" hx-target="#outcome" hx-swap="innerHTML">
  <textarea name="text" rows="6" placeholder="{{ placeholder }}" autofocus></textarea>
  <div class="fields">
    <input type="text" name="title" placeholder="{{ title_hint }}">
    <input type="text" name="group" placeholder="{{ group_hint }}">
    <label><input type="radio" name="target" value="notes" checked> notes</label>
    <label><input type="radio" name="target" value="context"> this project</label>
  </div>
  <button type="submit">{{ action }}</button>
</form>
<div id="outcome">{% include "outcome.html" %}</div>
{% endblock %}
