{% extends "base.html" %}
{% block main %}
<form class="search" hx-get="/hits" hx-target="#hits" hx-trigger="submit, input changed delay:400ms from:input[name=q]">
  <input type="search" name="q" value="{{ question }}" placeholder="Search" autofocus>
  <select name="scope">
    {% for name in scopes %}
    <option value="{{ name }}"{% if name == scope %} selected{% endif %}>{{ name }}</option>
    {% endfor %}
  </select>
  <button type="submit">Search</button>
</form>
<div id="hits">
{% include "hits.html" %}
</div>
{% endblock %}
