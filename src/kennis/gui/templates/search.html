{% extends "base.html" %}
{% block main %}
<form class="search" hx-get="/hits" hx-target="#hits"
      hx-trigger="submit, input changed delay:400ms from:input[name=q], change from:select[name=scope]">
  <input type="search" name="q" value="{{ question }}" placeholder="{{ search_hint }}" autofocus>
  <select name="scope" aria-label="{{ scope_label }}">
    <option value="{{ everywhere }}"{% if scope == everywhere %} selected{% endif %}>{{ everywhere_label }}</option>
    {% for name in scopes %}
    <option value="{{ name }}"{% if name == scope %} selected{% endif %}>{{ name }}</option>
    {% endfor %}
  </select>
  <button type="submit">{{ search_action }}</button>
</form>
<div id="hits">
{% include "hits.html" %}
</div>
<script defer src="/static/focus.js"></script>
{% endblock %}
