<p class="role-muted">{{ index_preamble }}</p>
<form hx-post="/index" hx-target="#job" hx-swap="innerHTML" data-closes-dialog>
  <div class="fields">
    <label><input type="radio" name="collection" value="" checked> every collection</label>
    {% for name in collections %}
    <label><input type="radio" name="collection" value="{{ name }}"> {{ name }}</label>
    {% endfor %}
  </div>
  <button type="submit">{{ index_action }}</button>
</form>
