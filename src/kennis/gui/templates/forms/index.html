<p class="role-muted">{{ index_preamble }}</p>
<form hx-disabled-elt="find button[type=submit]" hx-post="/index" hx-target="#job" hx-swap="innerHTML" data-closes-dialog>
  <div class="fields">
    <label><input type="radio" name="collection" value=""{% if not chosen %} checked{% endif %}> every collection</label>
    {% for name in collections %}
    <label><input type="radio" name="collection" value="{{ name }}"{% if name == chosen %} checked{% endif %}> {{ name }}</label>
    {% endfor %}
  </div>
  <button type="submit">{{ index_action }}</button>
</form>
