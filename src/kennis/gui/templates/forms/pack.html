<p class="role-muted" id="pack-preamble">{{ pack_preamble }}</p>
<form action="/pack" method="post" hx-disabled-elt="find button[type=submit]" hx-post="/pack" hx-target="#job" hx-swap="innerHTML" data-closes-dialog>
  <div class="fields">
    <label class="labelled"><span class="name">{{ pack_path_label }}</span><input type="text" name="path" placeholder="/path/to/pack.ken.yml" aria-describedby="pack-preamble" autofocus></label>
  </div>
  <button type="submit">{{ pack_action }}</button>
</form>
