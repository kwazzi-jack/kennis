<p class="role-muted">{{ preamble }}</p>
{# Not `data-closes-dialog`: the outcome is answered into this form's
   own `#outcome`, and the text stays in the box until the write is
   confirmed, so closing would hide both. #}
<form hx-disabled-elt="find button[type=submit]" hx-post="/remember" hx-target="#outcome" hx-swap="innerHTML">
  <textarea id="remember-text" name="text" rows="6" placeholder="{{ placeholder }}" autofocus></textarea>
  <div class="fields">
    <input type="text" name="title" placeholder="{{ title_hint }}">
    <input type="text" name="group" placeholder="{{ group_hint }}">
    <span class="segmented" role="radiogroup">{% for value, label in remember_targets %}<label><input type="radio" name="target" value="{{ value }}"{% if loop.first %} checked{% endif %}>{{ label }}</label>{% endfor %}</span>
  </div>
  <button type="submit">{{ action }}</button>
</form>
<div id="outcome">{% include "outcome.html" %}</div>
