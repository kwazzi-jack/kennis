<section class="recents" id="recents">
{% if recents %}
  <h2>{{ recents_heading }}</h2>
  <ol class="hits">
    {% for recent in recents %}
    <li>
      <a class="role-operation" href="{{ recent.href }}">{{ recent.query }}</a>
      <p class="role-muted detail">{{ recent.detail }}</p>
    </li>
    {% endfor %}
  </ol>
  <p class="recents-foot"><a class="button danger" href="/history/clear" hx-get="/history/clear" hx-target="#dialog" hx-swap="innerHTML">{{ icon("trash-2") }}{{ recents_clear }}</a></p>
{% endif %}
</section>
