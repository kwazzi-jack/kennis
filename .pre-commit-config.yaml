# Run `pre-commit install --install-hooks --hook-type commit-msg` once to
# activate these. Everything runs through `uv run` against the project's own
# environment rather than through pre-commit's isolated ones, so a hook and a
# terminal see the same ruff and the same mypy.
# `--no-sync` on every `uv run` below. Without it a hook re-syncs the
# project, and on a `cz bump` commit - where pyproject's version has just
# changed and uv.lock is part of what is being committed - that rewrites
# uv.lock while the commit is in flight. pre-commit sees a file modified
# during a hook and refuses the commit, which is how the first attempt at
# tagging v0.1.0 failed with a message that named the wrong hook.
repos:
  - repo: local
    hooks:
      - id: ruff-check
        name: ruff check
        entry: uv run --no-sync ruff check --force-exclude
        language: system
        types_or: [python, pyi]
        require_serial: true

      - id: ruff-format
        name: ruff format
        entry: uv run --no-sync ruff format --force-exclude
        language: system
        types_or: [python, pyi]
        require_serial: true

      - id: mypy
        name: mypy
        entry: uv run --no-sync mypy src
        language: system
        types_or: [python, pyi]
        pass_filenames: false
        require_serial: true

      # The ASCII rule cannot be expressed as a ruff rule - RUF001 catches
      # ambiguous unicode, not all of it - so it stays the grep.
      - id: ascii-only
        name: ascii only
        entry: sh scripts/check_ascii.sh
        language: system
        types: [text]

      # CLAUDE.md forbids a silenced type error, and nothing was enforcing it:
      # ruff has no rule for it and mypy runs against `src` only, so one sat
      # in the test suite unnoticed. This is the check that would have caught
      # it.
      - id: no-type-ignore
        name: no silenced type errors
        entry: sh scripts/check_no_type_ignore.sh
        language: system
        types: [python]

      - id: one-line-commit-message
        name: one-line commit message
        entry: uv run --no-sync scripts/check_commit_message.py
        language: system
        stages: [commit-msg]
        pass_filenames: true
        always_run: true

  # Commitizen validates the subject's shape. It permits a body, which the
  # one-line hook above is what refuses, so both are needed: a malformed
  # message is not merely untidy, it is a version decision silently omitted.
  - repo: https://github.com/commitizen-tools/commitizen
    rev: v4.18.1
    hooks:
      - id: commitizen
        stages: [commit-msg]
