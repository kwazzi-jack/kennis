# Rehearse a release on TestPyPI, by hand: build, upload, install, run.
#
# The build is uploaded as `<version>.dev<run number>` rather than the
# version in pyproject.toml, because an index accepts a version once and
# never again, even after deletion; a rehearsal that kept the real number
# could run only once. Everything else is what `release.yml` uploads.
#
# Trusted Publishing, as in `release.yml`: the publisher on test.pypi.org was
# registered with this file name and the `testpypi` environment.

name: rehearse

on:
  workflow_dispatch:
    inputs:
      ref:
        description: Branch, tag or commit to build
        default: main
        required: true

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.ref }}

      # A full version, not `@v10`: astral-sh/setup-uv publishes no moving
      # major tag, so `@v10` resolves to nothing and the job fails at setup.
      - uses: astral-sh/setup-uv@v10.2.0

      # `--no-sync`: only pyproject.toml changes, and only on the runner.
      - id: version
        run: |
          version="$(uv version --short).dev${GITHUB_RUN_NUMBER}"
          uv version --no-sync "$version"
          echo "version=$version" >> "$GITHUB_OUTPUT"

      - run: uv build

      - uses: actions/upload-artifact@v7
        with:
          name: dist
          path: dist/
          if-no-files-found: error

  publish:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: testpypi
      url: https://test.pypi.org/project/kennis/
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: dist
          path: dist/

      - uses: astral-sh/setup-uv@v10.2.0

      - run: >-
          uv publish --trusted-publishing always
          --publish-url https://test.pypi.org/legacy/

  # What a person typing `pip install kennis` would get, from the index
  # rather than from the build directory.
  install:
    needs: [build, publish]
    runs-on: ubuntu-latest
    env:
      VERSION: ${{ needs.build.outputs.version }}
    steps:
      - uses: astral-sh/setup-uv@v10.2.0

      - run: uv venv --python 3.12

      # Only kennis comes from TestPyPI. Anyone may upload anything there,
      # and it holds unrelated packages under common names - a `fastapi
      # 1.0` that does not build broke the first rehearsal when uv was
      # allowed to choose across TestPyPI and PyPI together. So the wheel
      # TestPyPI serves for this version is fetched by its own JSON
      # description, checked against the digest TestPyPI states, and
      # installed as a file. A just-uploaded version can take a minute or
      # two to appear, hence the retries.
      - name: Fetch the wheel from TestPyPI
        run: |
          for attempt in 1 2 3 4 5 6; do
            if curl -fsS "https://test.pypi.org/pypi/kennis/$VERSION/json" -o release.json; then
              break
            fi
            echo "attempt $attempt: not served yet" >&2
            sleep 30
          done
          url="$(jq -r '.urls[] | select(.packagetype == "bdist_wheel") | .url' release.json)"
          digest="$(jq -r '.urls[] | select(.packagetype == "bdist_wheel") | .digests.sha256' release.json)"
          mkdir -p wheel
          curl -fsS "$url" -o "wheel/$(basename "$url")"
          echo "$digest  wheel/$(basename "$url")" | sha256sum --check

      # Every dependency from PyPI, and torch from PyTorch's CPU index so
      # MinerU's torch is a few hundred megabytes rather than the CUDA
      # build's several gigabytes. The best match across those two is
      # asked for because PyTorch's index also carries old copies of
      # ordinary packages (#461); both are trusted with the install.
      - name: Install it with its dependencies from PyPI
        run: >-
          uv pip install wheel/*.whl
          --index-url https://pypi.org/simple/
          --extra-index-url https://download.pytorch.org/whl/cpu
          --index-strategy unsafe-best-match

      - run: .venv/bin/kennis --version

      - name: The installed version is the one uploaded
        run: |
          installed="$(.venv/bin/python -c 'import importlib.metadata as m; print(m.version("kennis"))')"
          test "$installed" = "$VERSION"
