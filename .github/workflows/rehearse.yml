# Rehearse a release on TestPyPI, by hand: build, upload, install, run.
#
# The build is uploaded as `<version>.dev<run number>` rather than the
# version in pyproject.toml, because an index accepts a version once and
# never again, even after deletion; a rehearsal that kept the real number
# could run only once. Everything else is what `release.yml` uploads.
#
# Trusted Publishing, as in `release.yml`: the publisher on test.pypi.org was
# registered with this file name and the `testpypi` environment.

name: rehearse

on:
  workflow_dispatch:
    inputs:
      ref:
        description: Branch, tag or commit to build
        default: main
        required: true

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.ref }}

      # A full version, not `@v10`: astral-sh/setup-uv publishes no moving
      # major tag, so `@v10` resolves to nothing and the job fails at setup.
      - uses: astral-sh/setup-uv@v10.2.0

      # `--no-sync`: only pyproject.toml changes, and only on the runner.
      - id: version
        run: |
          version="$(uv version --short).dev${GITHUB_RUN_NUMBER}"
          uv version --no-sync "$version"
          echo "version=$version" >> "$GITHUB_OUTPUT"

      - run: uv build

      - uses: actions/upload-artifact@v7
        with:
          name: dist
          path: dist/
          if-no-files-found: error

  publish:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: testpypi
      url: https://test.pypi.org/project/kennis/
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: dist
          path: dist/

      - uses: astral-sh/setup-uv@v10.2.0

      - run: >-
          uv publish --trusted-publishing always
          --publish-url https://test.pypi.org/legacy/

  # What a person typing `pip install kennis` would get, from the index
  # rather than from the build directory, on every platform and Python the
  # tests run on (`tests.yml`; a test keeps the two matrices equal). The
  # tests install from the lock and this resolves afresh, so this is where
  # a dependency with no wheel for one platform or one Python shows.
  install:
    needs: [build, publish]
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest]
        python: ["3.12", "3.13", "3.14"]
        include:
          - os: ubuntu-24.04
            python: "3.12"
          - os: macos-latest
            python: "3.12"
          - os: windows-latest
            python: "3.12"
    # Git Bash on Windows, so one script serves every platform.
    defaults:
      run:
        shell: bash
    env:
      VERSION: ${{ needs.build.outputs.version }}
    steps:
      - uses: astral-sh/setup-uv@v10.2.0

      - run: uv venv --python ${{ matrix.python }}

      # Only kennis comes from TestPyPI. Anyone may upload anything there,
      # and it holds unrelated packages under common names - a `fastapi
      # 1.0` that does not build broke the first rehearsal when uv was
      # allowed to choose across TestPyPI and PyPI together. So the wheel
      # TestPyPI serves for this version is fetched by its own JSON
      # description, checked against the digest TestPyPI states, and
      # installed as a file. A just-uploaded version can take a minute or
      # two to appear, hence the retries. In Python rather than curl, jq
      # and sha256sum, which are not the same tools on every image.
      - name: Fetch the wheel from TestPyPI
        run: |
          uv run --no-project --python ${{ matrix.python }} python - <<'EOF'
          import hashlib, json, os, pathlib, time, urllib.request
          address = f"https://test.pypi.org/pypi/kennis/{os.environ['VERSION']}/json"
          for attempt in range(1, 7):
              try:
                  with urllib.request.urlopen(address, timeout=60) as answer:
                      release = json.load(answer)
                  break
              except OSError as error:
                  print(f"attempt {attempt}: not served yet ({error})", flush=True)
                  time.sleep(30)
          else:
              raise SystemExit(f"{address} was never served")
          (wheel,) = [entry for entry in release["urls"] if entry["packagetype"] == "bdist_wheel"]
          with urllib.request.urlopen(wheel["url"], timeout=120) as answer:
              content = answer.read()
          if hashlib.sha256(content).hexdigest() != wheel["digests"]["sha256"]:
              raise SystemExit(f"{wheel['filename']}: digest differs from TestPyPI's")
          target = pathlib.Path("wheel") / wheel["filename"]
          target.parent.mkdir(exist_ok=True)
          target.write_bytes(content)
          print(f"{target}: OK")
          EOF

      # Every dependency from PyPI, and torch from PyTorch's CPU index so
      # MinerU's torch is a few hundred megabytes rather than the CUDA
      # build's several gigabytes. The best match across those two is
      # asked for because PyTorch's index also carries old copies of
      # ordinary packages (#461); both are trusted with the install.
      - name: Install it with its dependencies from PyPI
        run: >-
          uv pip install wheel/*.whl
          --index-url https://pypi.org/simple/
          --extra-index-url https://download.pytorch.org/whl/cpu
          --index-strategy unsafe-best-match

      # `uv run --no-project` uses `.venv` here, whose scripts are in
      # `bin` on Linux and macOS and in `Scripts` on Windows.
      - run: uv run --no-project kennis --version

      - name: The installed version is the one uploaded
        run: |
          installed="$(uv run --no-project python -c 'import importlib.metadata as m; print(m.version("kennis"))')"
          test "$installed" = "$VERSION"
