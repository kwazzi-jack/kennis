# Build the documentation site and publish it to GitHub Pages.
#
# The runner deploys, so nothing has to be pushed to a gh-pages branch by
# hand. Pages must be set to build from "GitHub Actions" in the repository's
# settings; with the default "Deploy from a branch" this workflow succeeds
# and publishes nothing.
#
# `--strict` turns a broken internal link or a missing nav entry into a
# failed build rather than a quietly wrong page.

name: docs

on:
  push:
    branches: [main]
  # So the site can be rebuilt without an empty commit.
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# One deployment at a time, and a superseded run is left to finish rather
# than cancelled: cancelling mid-deploy is how a half-published site happens.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: astral-sh/setup-uv@v10
        with:
          enable-cache: true
          # The lockfile is what decides the environment, so it is what the
          # cache key should follow.
          cache-dependency-glob: uv.lock

      # `.python-version` says 3.12 and uv honours it.
      - run: uv python install

      # `--no-dev` because the site needs mkdocs, not mypy, pytest and
      # pre-commit. mkdocstrings reads the source statically through
      # griffe, so nothing here imports kennis at runtime.
      - run: uv run --no-dev --group docs mkdocs build --strict

      - uses: actions/upload-pages-artifact@v5
        with:
          path: site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
