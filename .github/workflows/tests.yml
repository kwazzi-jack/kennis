# Run the test suite and the static gate on every push and pull request.
#
# The same four checks a commit runs locally through pre-commit - ruff check,
# ruff format, mypy, ASCII - plus the tests, which pre-commit does not run
# because a suite that takes twenty seconds does not belong on every commit.
# CI is where it does belong.
#
# `-m "not network and not slow"` is pytest's own default here, set in
# pyproject. The deselected tests need a host to be up or a model to download,
# and neither belongs in a run that gates a push.

name: tests

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

# A superseded run on the same ref is cancelled: unlike a Pages deploy,
# nothing is half-finished by stopping a test run.
concurrency:
  group: tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ${{ matrix.os }}
    strategy:
      # Every combination runs even when one fails, so a Windows-only or
      # 3.14-only break is visible as exactly that rather than hidden
      # behind another job's failure.
      fail-fast: false
      matrix:
        # Three platforms because milestone 9's whole justification for a
        # web interface over PySide6 was that it works on all three, and
        # until now nothing here had ever run on two of them. Concern #310.
        #
        # Not the full cross product. Every platform is covered once and
        # every Python once, which is four jobs rather than six: a
        # Windows-specific break and a 3.14-specific break are different
        # things, and running both Pythons on all three platforms buys a
        # third way of finding the same two.
        #
        # 3.12 and 3.14 are the floor and ceiling of `requires-python`.
        # 3.13 is skipped deliberately - it sits between two versions that
        # are both tested.
        os: [ubuntu-latest]
        python: ["3.12", "3.14"]
        include:
          - os: macos-latest
            python: "3.12"
          - os: windows-latest
            python: "3.12"
    steps:
      - uses: actions/checkout@v7

      # A full version, not `@v10`: astral-sh/setup-uv publishes no moving
      # major tag, so `@v10` resolves to nothing and the job fails at setup.
      - uses: astral-sh/setup-uv@v10.2.0
        with:
          enable-cache: true
          # The lockfile is what decides the environment, so it is what the
          # cache key should follow.
          cache-dependency-glob: uv.lock

      - run: uv python install ${{ matrix.python }}

      # `--frozen` so the lockfile is used as committed. A resolution that
      # drifts in CI tests an environment nobody has.
      # `--extra mcp` because `src/kennis/mcp/` imports fastmcp and mypy
      # checks all of `src`. Without it the type check fails on a module
      # whose dependency the job chose not to install, which is a gap in
      # the job rather than in the code. The `mcp` extra stays optional
      # for a user: `test_engine_imports_without_the_interface_libraries`
      # proves `import kennis.engine` works without it.
      - run: uv sync --frozen --extra mcp --extra gui --python ${{ matrix.python }}

      # `--python` on each run as well as on the sync: without it `uv run`
      # reads `.python-version`, which says 3.12, and warns that the
      # environment does not satisfy it on the 3.14 job. It ran 3.14 anyway,
      # but a warning that suggests the wrong interpreter is being used is
      # worth not printing.
      - name: ruff check
        run: uv run --no-sync --python ${{ matrix.python }} ruff check src tests

      - name: ruff format
        run: uv run --no-sync --python ${{ matrix.python }} ruff format --check src tests

      - name: mypy
        run: uv run --no-sync --python ${{ matrix.python }} mypy src

      - name: ascii only
        run: sh scripts/check_ascii.sh src tests docs scripts README.md

      - name: tests
        run: uv run --no-sync --python ${{ matrix.python }} pytest
