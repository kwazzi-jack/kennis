[project]
name = "kennis"
version = "0.0.0"
description = "Local knowledge and memory management system for users and AI"
readme = "README.md"
authors = [
    { name = "Brian Welman", email = "brianallisterwelman@gmail.com" }
]
requires-python = ">=3.12"
# "or later" rather than "only", which is the FSF's own recommendation; change
# it to GPL-3.0-only if a downstream should not be able to move to GPLv4.
license = "GPL-3.0-or-later"
license-files = ["LICENSE"]
classifiers = [
    "Development Status :: 2 - Pre-Alpha",
    "Environment :: Console",
    "Intended Audience :: Science/Research",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Text Processing :: Indexing",
    "Typing :: Typed",
]
# Carried over from boepie's own list, less the radio-astronomy stack
# (stimela, cult-cargo, scabha, python-casacore), which kennis is domain-
# agnostic precisely in order not to need. The comment on each group says
# which milestone first uses it, so an unused dependency is visible as such
# rather than mysterious.
#
# **The floors are the oldest release whose interface kennis relies on, not
# the version that happened to be current.** kennis is an application, so what
# is actually installed is decided by `uv.lock` and reproduced exactly by
# `uv sync`; the floors only choose what a future re-resolution may pick. A
# floor set to today's version therefore buys no reproducibility - the lock
# already gives that - and costs a conflict the first time something else in
# the environment needs a slightly older release. Raise one when kennis starts
# using something that release introduced, and say so in a comment.
dependencies = [
    # Interfaces. Small and pure Python, which is why they stay in the base
    # distribution rather than behind an extra.
    "click>=8.1",
    "rich>=13.0",
    "rich-click>=1.8",
    # Prompting. A runtime dependency rather than a development one, because
    # terminal interaction is a module every command resolves inputs through.
    "prompt-toolkit>=3.0",
    # Store layout, settings and schemas. Milestone 1.
    "platformdirs>=4.0",
    # pydantic 2 only: `extra="forbid"` on every model, and the v1 interface
    # is a different library wearing the same name.
    "pydantic>=2.9",
    "pydantic-settings>=2.6",
    # pydantic-settings only reads. Writes stay on tomlkit so that `config set`
    # round-trips the comments in config.toml.
    "tomlkit>=0.13",
    "pyyaml>=6.0",
    # Concurrency. One lock per corpus, taken with timeout=0 so a second
    # caller is told the corpus is busy rather than left blocking.
    "filelock>=3.12",
    # Ingestion. Milestone 2.
    "httpx>=0.27",
    "beautifulsoup4>=4.12",
    "markdownify>=0.13",
    "markdown-it-py>=3.0",
    "mdit-py-plugins>=0.4",
    # Retrieval. Milestone 3, and the weight of the install: fastembed brings
    # onnxruntime and bm25s brings numpy. Splitting them into their own
    # distribution was considered and rejected - see plan.md, "Should the
    # engine and the interfaces be separate packages?".
    "bm25s>=0.2",
    # numpy 2 only: kennis stores embeddings as arrays and reads them back, and
    # the 1.x/2.x promotion rules differ in ways a stored dtype would notice.
    "numpy>=2.0",
    "fastembed>=0.5",
    # The two hosted embedding backends the settings offer beside fastembed.
    "ollama>=0.4",
    "openai>=1.60",
]

[project.optional-dependencies]
# fastmcp is a real dependency that someone using kennis as a library, or only
# from the terminal, has no use for.
#
# The one exact pin, and the exception to the floor rule above, because it is
# the version boepie's MCP server is known to work against and the only thing
# kennis will have to port that code against. 4.x is out; revisit the pin when
# there is an MCP server here to test against it, not before.
mcp = ["fastmcp==3.4.7"]
mineru = [
    "mineru>=3",
]

[project.scripts]
kennis = "kennis.cli.__main__:main"

[dependency-groups]
# commitizen's floor is the one that matters: `cz bump` reads the commit log
# to decide the version, so an older release deciding differently is a silent
# wrong answer rather than an error.
dev = [
    "commitizen>=4.18",
    "mypy>=1.11",
    "pre-commit>=3.7",
    "pytest>=8.2",
    "pytest-cov>=5.0",
    "ruff>=0.6",
    "types-pyyaml>=6.0.12.20260906",
]

[build-system]
requires = ["uv_build>=0.12.16,<0.13.0"]
build-backend = "uv_build"

[tool.ruff]
line-length = 88
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "RUF", "ANN"]

[tool.ruff.lint.per-file-ignores]
# ANN201: a test's name is its description and its body is its assertion;
#   annotating every one of them `-> None` adds a line of noise per test and
#   catches nothing.
# ANN401: a test helper takes heterogeneous keyword overrides so each test can
#   name only the field it is about. Spelling that out as a union of every
#   field's type would be longer than the models it duplicates, and would have
#   to be kept in step with them by hand.
"tests/*" = ["ANN201", "ANN401"]

[tool.mypy]
strict = true
warn_unreachable = true

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra --strict-markers --strict-config"
xfail_strict = true
# An upstream deprecation becomes a failing test at the moment it appears,
# rather than a runtime break later.
filterwarnings = ["error"]

[tool.coverage.run]
source = ["src/kennis"]
branch = true

[tool.commitizen]
name = "cz_conventional_commits"
version_provider = "pep621"
update_changelog_on_bump = true
# Below 1.0 a breaking change bumps the minor version. Without this the first
# commit marked breaking would take the project straight to 1.0.0.
major_version_zero = true
tag_format = "v$version"
