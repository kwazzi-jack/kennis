[project]
name = "kennis"
version = "0.0.0"
description = "Local knowledge and memory management system for users and AI"
readme = "README.md"
authors = [
    { name = "Brian Welman", email = "brianallisterwelman@gmail.com" }
]
requires-python = ">=3.12"
# "or later" rather than "only", which is the FSF's own recommendation; change
# it to GPL-3.0-only if a downstream should not be able to move to GPLv4.
license = "GPL-3.0-or-later"
license-files = ["LICENSE"]
classifiers = [
    "Development Status :: 2 - Pre-Alpha",
    "Environment :: Console",
    "Intended Audience :: Science/Research",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Text Processing :: Indexing",
    "Typing :: Typed",
]
# Carried over from boepie's own list, less the radio-astronomy stack
# (stimela, cult-cargo, scabha, python-casacore), which kennis is domain-
# agnostic precisely in order not to need. Floors rather than boepie's exact
# pins on click and pydantic: those pins existed to hold that stack together,
# and there is no stack here to hold. The comment after each group says which
# milestone first uses it, so an unused dependency is visible as such rather
# than mysterious.
dependencies = [
    # Interfaces. Small and pure Python, which is why they stay in the base
    # distribution rather than behind an extra.
    "click>=8.4.2",
    "rich>=13.0.0",
    "rich-click>=1.9.8",
    # Prompting. A runtime dependency rather than a development one, because
    # terminal interaction is a module every command resolves inputs through.
    "prompt-toolkit>=3.0.52",
    # Store layout, settings and schemas. Milestone 1.
    "platformdirs>=4.10.0",
    "pydantic>=2.13.4",
    "pydantic-settings>=2.15.0",
    # pydantic-settings only reads. Writes stay on tomlkit so that `config set`
    # round-trips the comments in config.toml.
    "tomlkit>=0.15.1",
    "pyyaml>=6.0.3",
    # Concurrency. One lock per corpus, taken with timeout=0 so a second
    # caller is told the corpus is busy rather than left blocking.
    "filelock>=3.16",
    # Ingestion. Milestone 2.
    "httpx>=0.28.1",
    "beautifulsoup4>=4.15.0",
    "markdownify>=1.2.3",
    "markdown-it-py>=4.2.0",
    "mdit-py-plugins>=0.6.1",
    # Retrieval. Milestone 3, and the weight of the install: fastembed brings
    # onnxruntime and bm25s brings numpy. Splitting them into their own
    # distribution was considered and rejected - see plan.md, "Should the
    # engine and the interfaces be separate packages?".
    "bm25s>=0.3.9",
    "numpy>=2.4.6",
    "fastembed>=0.8.0",
    # The two hosted embedding backends the settings offer beside fastembed.
    "ollama>=0.6.2",
    "openai>=2.41.1",
]

[project.optional-dependencies]
# fastmcp is a real dependency that someone using kennis as a library, or only
# from the terminal, has no use for.
mcp = ["fastmcp==3.4.7"]

[project.scripts]
kennis = "kennis.cli.__main__:main"

[dependency-groups]
dev = [
    "commitizen>=4.18",
    "mypy>=1.11",
    "pre-commit>=3.7",
    "pytest>=8.2",
    "pytest-cov>=5.0",
    "ruff>=0.6",
]

[build-system]
requires = ["uv_build>=0.12.16,<0.13.0"]
build-backend = "uv_build"

[tool.ruff]
line-length = 88
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "RUF", "ANN"]

[tool.ruff.lint.per-file-ignores]
# A test's name is its description and its body is its assertion; annotating
# every one of them `-> None` adds a line of noise per test and catches nothing.
"tests/*" = ["ANN201"]

[tool.mypy]
strict = true
warn_unreachable = true

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra --strict-markers --strict-config"
xfail_strict = true
# An upstream deprecation becomes a failing test at the moment it appears,
# rather than a runtime break later.
filterwarnings = ["error"]

[tool.coverage.run]
source = ["src/kennis"]
branch = true

[tool.commitizen]
name = "cz_conventional_commits"
version_provider = "pep621"
update_changelog_on_bump = true
# Below 1.0 a breaking change bumps the minor version. Without this the first
# commit marked breaking would take the project straight to 1.0.0.
major_version_zero = true
tag_format = "v$version"
